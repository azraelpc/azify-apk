plugins {
    id 'com.android.application'
}

android {
    namespace 'org.azify.client'
    compileSdk 35

    defaultConfig {
        applicationId 'org.azify.client'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
        resourceConfigurations += ['en']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.6.1'
    implementation 'androidx.media3:media3-database:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.media:media:1.7.0'
}

def debugApkForArchive = project.layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
def apkArchiveDirectory = rootProject.file('APK')
def archiveDebugRequested = false
gradle.taskGraph.whenReady { graph ->
    archiveDebugRequested = graph.allTasks.any { it.path == ':app:assembleDebug' }
}
gradle.buildFinished { result ->
    if (result.failure != null || !archiveDebugRequested) {
        return
    }
    def source = debugApkForArchive.get().asFile
    if (!source.isFile()) {
        throw new GradleException('Cannot archive missing APK: ' + source)
    }
    def date = new java.text.SimpleDateFormat('ddMMyy', Locale.ROOT).format(new Date())
    def directory = apkArchiveDirectory
    directory.mkdirs()
    def temporary = new File(directory, '.Azify-' + date + '.tmp')
    def destination = new File(directory, 'Azify-' + date + '.apk')
    java.nio.file.Files.copy(source.toPath(), temporary.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    java.nio.file.Files.move(temporary.toPath(), destination.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    logger.lifecycle('APK archived: ' + rootProject.relativePath(destination))
}
